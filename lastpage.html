<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You 💕</title>
    <link rel="stylesheet" href="css/lastpage.css" />
  </head>
  <body>
    <!-- Floating Hearts Background -->
    <div id="bgHearts"></div>

    <!-- Main Content -->
    <div class="final-container">
      <div class="message-overlay">
        <h1>Thank You</h1>
      </div>

      <!-- Flower -->
      <div class="flower-wrapper">
        <div id="thankyou"><b>I hope you made it this far!</b></div>
        
        <div class="flower">
          <div class="f-wrapper">
            <div class="flower__line"></div>
            <div class="f">
              <div class="flower__leaf flower__leaf--1"></div>
              <div class="flower__leaf flower__leaf--2"></div>
              <div class="flower__leaf flower__leaf--3"></div>
              <div class="flower__leaf flower__leaf--4"></div>
              <div class="flower__leaf flower__leaf--5"></div>
              <div class="flower__leaf flower__leaf--6"></div>
              <div class="flower__leaf flower__leaf--7"></div>
              <div
                class="flower__leaf flower__leaf--8 flower__fall-down--yellow"
              ></div>
            </div>
          </div>

          <div class="f-wrapper f-wrapper--2">
            <div class="flower__line"></div>
            <div class="f">
              <div class="flower__leaf flower__leaf--1"></div>
              <div class="flower__leaf flower__leaf--2"></div>
              <div class="flower__leaf flower__leaf--3"></div>
              <div class="flower__leaf flower__leaf--4"></div>
              <div class="flower__leaf flower__leaf--5"></div>
              <div class="flower__leaf flower__leaf--6"></div>
              <div class="flower__leaf flower__leaf--7"></div>
              <div
                class="flower__leaf flower__leaf--8 flower__fall-down--pink"
              ></div>
            </div>
          </div>

          <div class="f-wrapper f-wrapper--3">
            <div class="flower__line"></div>
            <div class="f">
              <div class="flower__leaf flower__leaf--1"></div>
              <div class="flower__leaf flower__leaf--2"></div>
              <div class="flower__leaf flower__leaf--3"></div>
              <div class="flower__leaf flower__leaf--4"></div>
              <div class="flower__leaf flower__leaf--5"></div>
              <div class="flower__leaf flower__leaf--6"></div>
              <div class="flower__leaf flower__leaf--7"></div>
              <div
                class="flower__leaf flower__leaf--8 flower__fall-down--purple"
              ></div>
            </div>
          </div>
          <div class="flower__glass"></div>
        </div>
      </div>

      <!-- Final Message -->
      <div class="final-message">
        <div class="heart-divider">💕 ✦ 💕 ✦ 💕</div>
        <p class="closing-message">
          Thank you for taking the time to go through this.
          I hope it brought a smile to your face. 💖
        </p>
        <p class="closing-message">
          You're amazing, and don't you ever forget that! 😊
        </p>
        <div class="heart-divider">💕 ✦ 💕 ✦ 💕</div>
        <div class="final-emoji">🌸💕✨</div>
      </div>
    </div>

    <script>
      // ============================================
      // Background Floating Hearts
      // ============================================
      function createBackgroundHearts() {
        const container = document.getElementById('bgHearts');
        const emojis = ['❤️', '💕', '💗', '💖', '♥️', '💝', '💘'];
        
        for (let i = 0; i < 35; i++) {
          const heart = document.createElement('div');
          heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          const size = 15 + Math.random() * 35;
          const x = Math.random() * window.innerWidth;
          const y = Math.random() * window.innerHeight;
          const duration = 12 + Math.random() * 18;
          const delay = Math.random() * 10;
          
          heart.style.cssText = `
            position: fixed;
            left: ${x}px;
            top: ${y}px;
            font-size: ${size}px;
            opacity: ${0.08 + Math.random() * 0.15};
            animation: floatHeartBg ${duration}s ease-in-out infinite;
            animation-delay: ${delay}s;
            pointer-events: none;
            z-index: 0;
          `;
          container.appendChild(heart);
        }
      }

      // ============================================
      // Celebration Hearts on Load
      // ============================================
      function celebrateLoad() {
        const emojis = ['❤️', '💕', '💗', '💖', '💝', '💘', '✨', '🌟'];
        
        for (let i = 0; i < 40; i++) {
          setTimeout(() => {
            const heart = document.createElement('div');
            heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            const x = Math.random() * window.innerWidth;
            const size = 18 + Math.random() * 35;
            
            heart.style.cssText = `
              position: fixed;
              left: ${x}px;
              top: -50px;
              font-size: ${size}px;
              pointer-events: none;
              z-index: 9999;
              animation: heartRain ${2 + Math.random() * 3}s linear forwards;
              animation-delay: ${Math.random() * 0.3}s;
            `;
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
          }, i * 30);
        }
      }

      // ============================================
      // Add CSS Animations
      // ============================================
      const style = document.createElement('style');
      style.textContent = `
        @keyframes floatHeartBg {
          0%, 100% {
            transform: translateY(0) rotate(0deg) scale(1);
            opacity: 0.08;
          }
          50% {
            transform: translateY(-50px) rotate(10deg) scale(1.2);
            opacity: 0.2;
          }
        }
        
        @keyframes heartRain {
          0% {
            transform: translateY(0) rotate(0deg) scale(0.5);
            opacity: 0;
          }
          10% {
            opacity: 1;
            transform: translateY(20px) rotate(10deg) scale(1);
          }
          100% {
            transform: translateY(110vh) rotate(360deg) scale(1);
            opacity: 0;
          }
        }
        
        @keyframes fadeInUp {
          from {
            opacity: 0;
            transform: translateY(30px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        
        @keyframes pulse {
          0%, 100% {
            transform: scale(1);
          }
          50% {
            transform: scale(1.05);
          }
        }
      `;
      document.head.appendChild(style);

      // ============================================
      // Initialize
      // ============================================
      createBackgroundHearts();
      
      // Celebrate after a short delay
      setTimeout(() => {
        celebrateLoad();
      }, 500);

      console.log('🌸 Thank you for visiting!');
      console.log('💕 You made it to the end!');
    </script>
  </body>
</html>
